name: ZMK Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        board: ["nice_nano_v2"]
        shield: ["corne_left", "corne_right", "settings_reset"]

    steps:
      - uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
        with:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
